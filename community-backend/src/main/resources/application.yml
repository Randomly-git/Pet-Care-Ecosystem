server:
  port: 0 # 随机端口

spring:
  config:
    import: optional:file:../program-config.yml
  application:
    name: community-backend # 这个名字要和网关配置里的 lb:// 后面一致
  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.host:localhost}:${nacos.port:8848}
  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:pet_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# 开发环境日志级别
logging:
  level:
    com.petcare.backend: DEBUG
    org.hibernate.SQL: DEBUG

app:
  # 媒体服务地址，根据实际部署情况修改
  media-service:
    url: http://media-backend
  user-service:
    url: http://petcare-backend  # 指向petcare-backend

# CORS配置
web:
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
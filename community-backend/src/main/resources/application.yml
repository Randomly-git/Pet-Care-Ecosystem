server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://47.100.240.111:3306/pet_space_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: Db123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# 开发环境日志级别
logging:
  level:
    com.petcare.backend: DEBUG
    org.hibernate.SQL: DEBUG

app:
  # 媒体服务地址，根据实际部署情况修改
  media-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082  # 指向petcare-backend

# CORS配置
web:
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
# 在文件开头或合适的位置添加
server:
  port: 8082  # 添加这一行，与前端配置保持一致
  address: 0.0.0.0  # 可选，允许外部访问

spring:
  datasource:
    url: jdbc:mysql://47.100.240.111:3306/pet_space_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: Db123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # 文件上传配置 - 单个文件和整个请求都最大100MB
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB

# 开发环境日志级别
logging:
  level:
    com.petcare.backend: DEBUG
    org.hibernate.SQL: DEBUG
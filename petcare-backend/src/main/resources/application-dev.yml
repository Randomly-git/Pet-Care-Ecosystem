# 在文件开头或合适的位置添加
#server:
#  port: 8082  # 添加这一行，与前端配置保持一致
#  address: 0.0.0.0  # 可选，允许外部访问

server:
  port: 0 # 随机端口

spring:
  config:
    import: optional:file:../program-config.yml
  application:
    name: petcare-backend # 这个名字要和网关配置里的 lb:// 后面一致
  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.host:localhost}:${nacos.port:8848}
  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:pet_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # 文件上传配置 - 单个文件和整个请求都最大100MB
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB

# 开发环境日志级别
logging:
  level:
    com.petcare.backend: DEBUG
    org.hibernate.SQL: DEBUG
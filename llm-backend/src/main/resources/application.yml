server:
  port: 0 # 随机端口

spring:
  config:
    import:
      - optional:file:./program-config.yml  # 试试当前目录
      - optional:file:../program-config.yml # 试试上级目录
  application:
    name: llm-backend # 这个名字要和网关配置里的 lb:// 后面一致
  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.host:localhost}:${nacos.port:8848}

  # 数据库配置
  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:pet_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # RabbitMQ 配置
  rabbitmq:
    host: ${rabbitmq.host:localhost}
    port: ${rabbitmq.port:5672}
    username: ${rabbitmq.username:guest}
    password: ${rabbitmq.password:guest}
    virtual-host: ${rabbitmq.virtual-host:/}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10

# 服务接口地址配置
pet:
  service:
    base-url: http://petcare-backend

# 大模型 API 配置
qwen:
  api-key: sk-972a298500904e809a415aa9f153caac
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3-max
  timeout: 30000

# 日志配置
logging:
  level:
    com:
      example:
        demo: DEBUG
    root: INFO

# 添加超时配置（配合RestTemplateConfig使用）
rest-client:
  timeouts:
    connect-timeout: 3000           # 连接超时3秒
    internal-read-timeout: 5000     # 内部服务读取超时5秒
    ai-read-timeout: 90000          # AI服务读取超时90秒
    secret-id: AKIDvwpY5P1Uo381lJgrsoY8Wihx1sWBfx3x
    secret-key: jInFZgaJrGUZUKyPfibIhQ2TlxCMZedb
    region: ap-shanghai
    bucket-name: pet-care-ecosystem-1386623384
    static-website-url: https://pet-care-ecosystem-1386623384.cos-website.ap-shanghai.myqcloud.com
    # 归档恢复配置
    restore:
      wait-minutes: 3    # 等待归档文件恢复的时间（分钟）
      expiry-minutes: 10 # 归档文件临时访问时间（分钟）

# 冷热分离配置
cold:
  storage:
    private:
      days: 30    # 用户私人数据（活动/状态记录）归档天数
    community:
      days: 7     # 社区动态归档天数（未访问）
    restore:
      wait-minutes: 3    # 恢复等待时间
      expiry-minutes: 10  # 临时访问时长

logging:
  level:
    com.petcare.media: DEBUG
    com.qcloud.cos: DEBUG
    org.springframework.cache: TRACE # 开启缓存日志便于调试
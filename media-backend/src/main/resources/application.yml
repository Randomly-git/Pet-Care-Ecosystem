server:
  port: 0

spring:
  config:
    import:
      - optional:file:./program-config.yml  # 试试当前目录
      - optional:file:../program-config.yml # 试试上级目录
  application:
    name: media-backend
  cloud:
    nacos:
      discovery:
        server-addr: ${nacos.host:localhost}:${nacos.port:8848}

  # --- 新增 Redis 配置 ---
  data:
    redis:
      host: ${redis.host:localhost} # 从全局 program-config.yml 读取
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: 0      # 指定数据库索引
      timeout: 5000ms # 适当延长超时时间
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # --- 新增 Cache 配置 ---
  cache:
    type: redis
    redis:
      time-to-live: 7200000 # 缓存过期时间（单位毫秒，这里设为2小时）
      cache-null-values: false # 不缓存空值，防止缓存穿透
      use-key-prefix: true
      key-prefix: "petcare:media:" # 所有的缓存 key 都会带上这个前缀

  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:pet_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ... hikari 保持不变

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true


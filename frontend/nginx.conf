server {
    listen 80;
    server_name localhost;

    # 1. 静态资源托管 (对应 vite build 后的 dist 目录)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 解决 Vue Router 在 history 模式下刷新 404 的问题
        try_files $uri $uri/ /index.html;
    }

    # 2. 统一网关转发 (对应 vite 中的 /api)
    location /api/ {
        # 注意：这里的 petcare-gateway 是 docker-compose 中的服务名
        proxy_pass http://petcare-gateway:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. GraphQL 转发 (对应 vite 中的 /graphql)
    location /graphql {
        proxy_pass http://petcare-gateway:9000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 移除可能导致 CORS 的头信息（模拟 Vite 里的配置）
        proxy_set_header Origin "";
        proxy_set_header Referer "";
    }

    # 4. 媒体文件访问 (对应 vite 中的 /uploads)
    location /uploads/ {
        proxy_pass http://petcare-gateway:9000/uploads/;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}